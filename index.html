<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon Organisateur</title>
  <meta name="description" content="Projets, tâches et journée au même endroit.">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { var t = localStorage.getItem('mo-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="view" id="view"></main>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog class="sheet" id="sheet"></dialog>
  <noscript>Cette application a besoin de JavaScript pour fonctionner.</noscript>
</body>
</html>
